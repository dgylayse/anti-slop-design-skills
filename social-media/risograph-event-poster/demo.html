dding-top:21px;font:16px monospace}</style></head><body><div class="social-back" data-mode="risograph-event-poster"><div class="social-card"><div class="label">OPEN STUDIO / FIELD NOTES</div><h1>MAKE.<br>PRINT.<br>REPEAT.</h1><p class="small">A distinctive idea deserves an unforgettable frame.</p><div class="foot"><span>DESIGN STUDY</span><span>01 / 05</span></div></div></div></body></html>
